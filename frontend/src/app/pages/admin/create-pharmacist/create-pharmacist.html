<app-layout>
    <div class="create-page">
        <div class="card form-card">
            <div class="card-header">
                <h2>Create Pharmacist Account</h2>
                <p>Register a new pharmacist for your hospital</p>
            </div>

            <form [formGroup]="pharmacistForm" (ngSubmit)="onSubmit()">
                <div class="form-section">
                    <h3>Personal Information</h3>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" formControlName="name" placeholder="Pharmacist Name">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" formControlName="email" placeholder="pharmacist@hospital.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" formControlName="password" placeholder="Password">
                    </div>
                </div>

                <div class="form-section">
                    <h3>Professional Details</h3>
                    <div class="form-group">
                        <label>License Number</label>
                        <input type="text" formControlName="licenseNumber" placeholder="License #">
                    </div>
                    <div class="form-group">
                        <label>Experience (Years)</label>
                        <input type="number" formControlName="experienceYears" placeholder="Years of experience">
                    </div>
                </div>

                <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
                <div class="alert alert-success" *ngIf="success">{{ success }}</div>

                <div class="form-actions">
                    <button type="button" class="btn-text" routerLink="/dashboard">Cancel</button>
                    <button type="submit" class="btn-primary" [disabled]="pharmacistForm.invalid || loading">
                        {{ loading ? 'Creating...' : 'Create Pharmacist' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</app-layout>
