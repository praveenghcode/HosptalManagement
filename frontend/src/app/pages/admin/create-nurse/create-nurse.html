<app-layout>
    <div class="create-page">
        <div class="card form-card">
            <div class="card-header">
                <h2>Create Nurse Account</h2>
                <p>Register a new nurse for your hospital</p>
            </div>

            <form [formGroup]="nurseForm" (ngSubmit)="onSubmit()">
                <!-- Personal Info -->
                <div class="form-section">
                    <h3>Personal Information</h3>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" formControlName="name" placeholder="Nurse Name">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" formControlName="email" placeholder="nurse@hospital.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" formControlName="password" placeholder="Password">
                    </div>
                </div>

                <!-- Professional Info -->
                <div class="form-section">
                    <h3>Professional Details</h3>
                    <div class="form-group">
                        <label>Department ID</label>
                        <input type="number" formControlName="departmentId" placeholder="e.g. 1 (Cardiology)">
                        <small class="hint">Enter the ID of the department</small>
                    </div>
                    <div class="form-group">
                        <label>License Number</label>
                        <input type="text" formControlName="licenseNumber" placeholder="License #">
                    </div>
                    <div class="form-group">
                        <label>Experience (Years)</label>
                        <input type="number" formControlName="experienceYears" placeholder="Years of experience">
                    </div>
                    <div class="form-group">
                        <label>Shift</label>
                        <select formControlName="shift">
                            <option value="">Select Shift</option>
                            <option value="Morning">Morning</option>
                            <option value="Evening">Evening</option>
                            <option value="Night">Night</option>
                        </select>
                    </div>
                </div>

                <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
                <div class="alert alert-success" *ngIf="success">{{ success }}</div>

                <div class="form-actions">
                    <button type="button" class="btn-text" routerLink="/dashboard">Cancel</button>
                    <button type="submit" class="btn-primary" [disabled]="nurseForm.invalid || loading">
                        {{ loading ? 'Creating...' : 'Create Nurse' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</app-layout>
