<div class="layout-container" [class.collapsed]="sidebarCollapsed" *ngIf="user$ | async as user">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
                    <rect width="48" height="48" rx="12" fill="white" fill-opacity="0.2" />
                    <path d="M24 10V38M17 24H31" stroke="white" stroke-width="4" stroke-linecap="round" />
                    <circle cx="24" cy="24" r="14" stroke="white" stroke-width="2" fill="none" />
                </svg>
                <span class="logo-text">MedCare</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            @for (item of getNavItems(user.role); track item.route) {
            <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                class="nav-item">
                <span class="nav-icon">{{ item.icon }}</span>
                <span class="nav-label">{{ item.label }}</span>
            </a>
            }
        </nav>

        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="avatar">{{ user.name.charAt(0).toUpperCase() }}</div>
                <div class="user-info">
                    <p class="user-name">{{ user.name }}</p>
                    <span class="role-badge" [ngClass]="getRoleBadgeClass(user.role)">{{ formatRole(user.role) }}</span>
                </div>
            </div>
            <button class="logout-btn" (click)="logout()" title="Sign Out">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" (click)="toggleSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <div class="top-bar-right">
                <div class="notification-bell">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 01-3.46 0" />
                    </svg>
                    <span class="notification-dot"></span>
                </div>
                <div class="user-greeting">
                    <span class="greeting-text">Hello,</span>
                    <span class="greeting-name">{{ user.name }}</span>
                </div>
            </div>
        </header>

        <div class="content-area">
            <ng-content></ng-content>
        </div>
    </main>
</div>
